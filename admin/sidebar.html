<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="flex bg-gray-100 min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 h-full bg-white shadow-md" id="sidebar">
        <section class="container flex flex-col">
            <!-- User Info -->
            <div class="flex items-center space-x-3 px-6 py-4 border-b">
                <img id="navUserImage" src="https://via.placeholder.com/40" alt="User Avatar" class="w-10 h-10 rounded-full">
                <div>
                    <p id="navUserName" class="text-gray-800 font-semibold">Admin Name</p>
                    <p class="text-gray-500 text-sm">Administrator</p>
                </div>
            </div>

            <!-- Links -->
            <div class="space-y-2">
                <a href="/user/index.html" class="block py-2 pl-10 text-gray-700 hover:bg-blue-100">
                    <i class="fa-solid fa-house mr-2"></i>
                    Front Page
                </a>
                <a href="add_product.html" class="block py-2 pl-10 text-gray-700 hover:bg-blue-100">
                    <i class="fa-solid fa-plus mr-2"></i>
                    Add Product
                </a>
                <a href="list_of_product.html" class="block py-2 pl-10 text-gray-700 hover:bg-blue-100">
                    <i class="fa-solid fa-shirt mr-2"></i>
                    Products List
                </a>
                <a href="#" id="logoutBtn" class="block pl-10 py-2 text-red-600 hover:bg-red-100">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                </a>
            </div>
        </section>
    </aside>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {

            function loadUser() {
                const user = JSON.parse(localStorage.getItem('user'));
                if (user) {
                    $('#navUserName').text(user.name);
                    $('#navUserImage').attr('src', user.profile || 'https://via.placeholder.com/40');
                } else {
                    window.location.href = '/auth/login.html';
                }
            }

            loadUser();

            // ✅ Logout function
            $('#logoutBtn').on('click', function (e) {
                e.preventDefault();
                localStorage.removeItem('user'); 
                window.location.href = '/auth/login.html';
            });

        });
    </script>
</body>

</html>
