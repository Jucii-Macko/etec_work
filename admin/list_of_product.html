<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>List Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="flex bg-gray-100 min-h-screen">
    <!-- Sidebar container -->
    <div id="sidebar"></div>

    <!-- Product List -->
    <div class="flex-1 p-6">
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Product List</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="p-3">ID</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Price</th>
                        <th class="p-3">Size</th>
                        <th class="p-3">Color</th>
                        <th class="p-3">Thumbnail</th>
                        <th class="p-3">Category</th>
                        <th class="p-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                    <!-- Products will go here -->

                </tbody>
            </table>
        </div>
    </div>

<div class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4  " >
        <input type="text" name="id" id="pro_id">
        <input type="text" name="edit_name" >
        <input type="text" name="edit_regular_price" >
        <input type="text" name="edit_sale_price" >
        <input type="text" name="edit_size" >
        <input type="text" name="edit_color">
        <input type="text" name="edit_category">
        <input type="file" name="edit_thumbnail" >
    </div>
    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
        Add Product
    </button>
</div>
   
</body>

</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $("#sidebar").load("sidebar.html");
    $(document).ready(function () {
        loadProducts();
        function loadProducts() {
            $("#productTable").html(`<tr><td colspan="7" class="text-center p-4"></td></tr>`);
                $.ajax({
                url: 'http://127.0.0.1:8000/api/products',
                method: "GET",

                success: function (res) {
                    let products = res.data;
                    let row = "";
                    products.forEach(pro => {
                        row += `
                            <tr class="border-t">
                                <td class="p-3">${pro.id}</td>
                                <td class="p-3">${pro.name}</td>
                                <td class="p-3">
                                    <span class="line-through text-gray-400">$${pro.regular_price}</span>
                                    <span class="text-green-600 font-bold ml-2">$${pro.sale_price}</span>
                                </td>
                                <td class="p-3">${pro.size}</td>
                                <td class="p-3">${pro.color}</td>
                                <td class="p-3"><img src="${pro.thumbnail}" class="w-12 h-12 object-contain"></td>
                                <td class="p-3">${pro.category}</td>
                                <td class="p-3">
                                    <button data-id="${pro.id}" class="text-blue-500 btn-edit hover:underline">Edit</button>
                                    <button data-id="${pro.id}" class="text-red-500  btn-delete hover:underline ml-2">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                    $("#productTable").html(row);
                }
            });
        }


        // delete 
        $("#productTable").on("click", ".btn-delete", function () {
            let id = $(this).data("id");
            Swal.fire({
                title: "Are you sure?",
                text: "You won't be able to revert this!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#3085d6",
                cancelButtonColor: "#d33",
                confirmButtonText: "Yes, delete it!"
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: `http://127.0.0.1:8000/api/product/${id}`,
                        method: "DELETE",
                        success: function (res) {
                            loadProducts();
                        }
                    });
                }
            });
        });
    
        // update
        /*$("#productTable").on("click", ".btn-edit", function(){
            //alert("edit");
            let id = $(this).data("id");
            window.location.href = `add_product.html?id=${id}`;
        });*/
    });



</script>
