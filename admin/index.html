<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="flex bg-gray-100 min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md" id="sidebar"></aside>
    

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
        <div class="main_index">
            <!-- Topbar -->
            <header class="flex items-center justify-between bg-white p-4 shadow">
            <input type="text" placeholder="Search..." class="border rounded-lg px-4 py-2 w-1/3">
            <div class="flex items-center gap-4">
                <span class="text-gray-700">Hello, User</span>
                <img src="https://i.pravatar.cc/40" alt="profile" class="w-10 h-10 rounded-full">
            </div>
            </header>

            <!-- Dashboard Content -->
            <main class="p-6 space-y-6">

                <!-- Stats -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Total Sales</h3>
                    <p class="text-2xl font-bold">$12,340</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Users</h3>
                    <p class="text-2xl font-bold">1,230</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-gray-500">Orders</h3>
                    <p class="text-2xl font-bold">320</p>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-lg font-semibold mb-4">Recent Orders</h2>
                    <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100">
                        <th class="p-3">Order ID</th>
                        <th class="p-3">Customer</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-t">
                        <td class="p-3">#1001</td>
                        <td class="p-3">John Doe</td>
                        <td class="p-3"><span class="text-green-600">Completed</span></td>
                        <td class="p-3">$120</td>
                        </tr>
                        <tr class="border-t">
                        <td class="p-3">#1002</td>
                        <td class="p-3">Jane Smith</td>
                        <td class="p-3"><span class="text-yellow-600">Pending</span></td>
                        <td class="p-3">$80</td>
                        </tr>
                        <tr class="border-t">
                        <td class="p-3">#1003</td>
                        <td class="p-3">Mike Ross</td>
                        <td class="p-3"><span class="text-red-600">Cancelled</span></td>
                        <td class="p-3">$50</td>
                        </tr>
                    </tbody>
                    </table>
                </div>
            </main>
        </div>

        <!-- list product -->
        <div class="flex-1 p-6 " id="list-product">
            
        </div>

    
</body>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
