<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
</head>
<body>
<!-- <nav id="navbar" class="bg-white shadow-md px-4 mb-4 py-4 flex justify-between items-center rounded-3xl mx-6 mt-4"> -->
    <div class="flex space-x-4">
    <!-- Home link -->
        <a href="/user/index.html" class="text-xl font-bold text-gray-800 hover:text-gray-600">Home</a>

        <!-- Category dropdown -->
        <div class="relative group">
            <p class="text-xl font-bold text-gray-800 hover:text-gray-600">
                Category
            </p>
            <div class="absolute left-0 mt-2 w-40 bg-white border rounded shadow-md opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all duration-200 z-50">
                <a href="#" class="category-link block px-4 py-2 hover:bg-gray-100">Men</a>
                <a href="#" class="category-link block px-4 py-2 hover:bg-gray-100">Women</a>
                <a href="#" class="category-link block px-4 py-2 hover:bg-gray-100">Essential</a>
            </div>
        </div>
    </div>


    <div class="flex items-center space-x-4">
        <!-- Search -->
         <div>
            <input type="text" id="search" placeholder="Search products..." 
            class="px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fa-brands fa-searchengin"></i>
         </div>
        
        <!-- User Profile -->
        <div class="relative group">
            <button class="flex items-center space-x-2 hover:bg-gray-100 px-3 py-2 rounded-lg">
                <img id="navUserImage" src="https://via.placeholder.com/32" alt="User" class="w-8 h-8 rounded-full transition-transform duration-300 group-hover:scale-110">
                <span id="navUserName" class="text-gray-800 font-medium">User</span>
            </button>
            <!-- Dropdown -->
            <div class="absolute right-0 mt-2 w-40 bg-white border rounded shadow-md opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all duration-300 z-50">
                <p class="px-4 py-2 text-gray-700 font-semibold" id="dropdownUserName">User</p>
                <p class="px-4 py-2 text-gray-500 text-sm" id="dropdownUserEmail">email@example.com</p>
                <a href="#" id="logoutBtn" class="block px-4 py-2 hover:bg-gray-100 text-red-500">Logout</a>
            </div>
        </div>

    </div>
<!-- </nav> -->

</body>
</html>

<script>
    $(document).on("click", ".category-link",function(e){
            e.preventDefault();
            const category = $(this).text();
            const container = $("#products");
            container.html(`<div class="text-center p-4">Loading...</div>`);
            $.ajax({
                url : `http://127.0.0.1:8000/api/products/category/${category}`,
                method :"GET",
                success: function (response) {
                    const products = response.data; 
                    container.html(''); 

                    products.forEach(product => {
                        const productCard = `
                            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                <a href="detail.html?id=${product.id}">
                                    <img 
                                        src="${product.thumbnail}" 
                                        alt="${product.name}" 
                                        class="w-full h-100 object-cover"
                                    >
                                </a>
                                <div class="p-4 text-center">
                                    <h2 class="text-lg font-semibold mb-2">${product.name}</h2>
                                    <div class="flex justify-center gap-2 items-center">
                                        <p class="font-bold text-gray-500 line-through">$${product.regular_price}</p>
                                        <p class="font-bold text-red-500">$${product.sale_price}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                        container.append(productCard);
                    });
                }
            })
        });
    
    
    $(document).ready(function() {
            loadUser();
            // logout
            $('#logoutBtn').on('click', function(e) {
                e.preventDefault();

                // Clear stored user info
                $('#navUserName').text('User');
                $('#dropdownUserName').text('User');
                $('#dropdownUserEmail').text('email@example.com');
                $('#navUserImage').attr('src', 'https://via.placeholder.com/32');

                window.location.href = '/auth/login.html';
            });
        
            // get user info
            function loadUser() {
                const user = JSON.parse(localStorage.getItem('user'));
                if(user){
                    $('#navUserName').text(user.name);
                    $('#dropdownUserName').text(user.name);
                    $('#dropdownUserEmail').text(user.email);
                    $('#navUserImage').attr('src', user.profile || 'https://via.placeholder.com/32');
                    // that http just default backup image
                } else {
                    window.location.href = '/auth/login.html';
                }
            };
        
            // search
            
            function searchProducts(query) {
                const container = $('#products');
                container.html(`<div class="text-center p-4">Searching for "${query}"...</div>`);

                $.ajax({
                    url: `http://127.0.0.1:8000/api/products/search/${query}`,
                    method: 'GET',
                    success: function (response) {
                        const products = response.data || [];
                        
                        container.html(products.map(p => `
                            <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                <a href="detail.html?id=${p.id}">
                                    <img src="${p.thumbnail}" alt="${p.name}" class="w-full h-100 object-cover">
                                </a>
                                <div class="p-4 text-center">
                                    <h2 class="text-lg font-semibold mb-2">${p.name}</h2>
                                    <div class="flex justify-center gap-2 items-center">
                                        <p class="font-bold text-gray-500 line-through">$${p.regular_price}</p>
                                        <p class="font-bold text-red-500">$${p.sale_price}</p>
                                    </div>
                                </div>
                            </div>
                        `).join(''));
                    },
                });
            }

            $('#search').on('keyup', function (e) {
                if (e.key === 'Enter') searchProducts($(this).val());
            });
            $(document).on('click', '.fa-searchengin', function () {
                const query = $('#search').val();
                searchProducts(query);
            });
    });
</script>
