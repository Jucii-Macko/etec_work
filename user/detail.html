<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 px-6">
<nav id="navbar" class="bg-white shadow-md px-4 mb-4 py-4 flex justify-between items-center rounded-3xl mx-6 mt-4">
    
</nav>

    <div id="product-detail" class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row gap-6">
        Loading...
    </div>
</body>
</html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#navbar").load("navbar.html");

            const id = new URLSearchParams(window.location.search).get("id");
            $.ajax({
                url: `http://127.0.0.1:8000/api/product/${id}`, 
                method: "GET",
                success: function (response) {
                    const p = response.data;
                    const row = `
                        <div class="w-full">
                            <img src="${p.thumbnail}" alt="${p.name}" class="w-full h-auto rounded-md object-cover">
                        </div>
                        <div class="w-full flex flex-col justify-start text-start">
                            <h1 class="text-3xl font-bold mb-4">${p.name}</h1>
                            <p class="text-sm line-through text-gray-500 mb-1">Regular: $${p.regular_price}</p>
                            <p class="text-xl font-bold text-red-500 mb-3">Sale: $${p.sale_price}</p>
                            <img src="${p.thumbnail}" width="100" class="rounded border border-gray-300">
                            <p class="text-sm text-gray-900 mt-2 mb-2">Color: ${p.color}</p>
                            <p class="text-sm text-gray-700 mb-2">Size: ${p.size}</p>
                            <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full md:w-auto">
                                Add to Cart
                            </button>
                        </div>
                    `;
                    $("#product-detail").html(row);
                }
            });
        });

    </script>
