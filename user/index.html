<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-gray-100 px-6">
<nav id="navbar" class="bg-white shadow-md px-4 mb-4 py-4 flex justify-between items-center rounded-3xl mx-6 mt-4">
    
</nav>


    
    <h1 class="text-3xl font-bold text-center mb-8">Products</h1>
    <!-- Product  -->
    <div id="products" class="px-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Products will load here -->
        
    </div>
</body>
</html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            loadProducts();
            $("#navbar").load("navbar.html");

            
            // all products
            function loadProducts() {
                const container = $("#products");
                container.html(`<div class="text-center p-4">Loading...</div>`);
                $.ajax({
                    url : 'http://127.0.0.1:8000/api/products',
                    method :"GET",
                    success: function (response) {
                        const products = response.data; 
                        container.html(''); 

                        products.forEach(product => {
                            const productCard = `
                                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                                    <a href="detail.html?id=${product.id}">
                                        <img 
                                            src="${product.thumbnail}" 
                                            alt="${product.name}" 
                                            class="w-full h-100 object-cover"
                                        >
                                    </a>
                                    <div class="p-4 text-center">
                                        <h2 class="text-lg font-semibold mb-2">${product.name}</h2>
                                        <div class="flex justify-center gap-2 items-center">
                                            <p class="font-bold text-gray-500 line-through">$${product.regular_price}</p>
                                            <p class="font-bold text-red-500">$${product.sale_price}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                            container.append(productCard);
                        });
                    }
                })
            }



        })

    </script>
